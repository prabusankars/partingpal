services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: partingpal
      POSTGRES_PASSWORD: partingpal
      POSTGRES_DB: partingpal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partingpal"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://partingpal:partingpal@db:5432/partingpal
      FRONTEND_ORIGIN: http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8080
      # Reach an Ollama running on the host machine
      OSS_BASE_URL: ${OSS_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
